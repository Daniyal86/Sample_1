/* ==========================================================================
   SCENE 1: ENVELOPE OPENING EXPERIENCE
   ========================================================================== */
.opening{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:
    radial-gradient(circle at 50% 18%, rgba(212,175,55,0.25) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 50%, #460E18 0%, #26050C 55%, #0F0104 100%);
  transition:opacity 0.75s cubic-bezier(0.4, 0, 0.2, 1);
  animation:fade 0.8s ease backwards;
  overflow:hidden;
}
.js .opening{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(16px, 3vh, 32px);
}
.opening.is-fading{opacity:0;pointer-events:none}

/* Swaying Royal Palace Lanterns */
.opening-lantern{
  position:absolute;
  top:0;
  z-index:2;
  pointer-events:none;
  display:none;
  transform-origin:top center;
}
@media (min-width:768px){
  .opening-lantern{display:block}
}
.lantern-left{
  left:clamp(20px, 8vw, 100px);
  animation:lantern-sway 6s ease-in-out infinite alternate;
}
.lantern-right{
  right:clamp(20px, 8vw, 100px);
  animation:lantern-sway 7s 1.5s ease-in-out infinite alternate-reverse;
}
.lantern-chain{
  width:2px;
  height:clamp(70px, 15vh, 130px);
  margin:0 auto;
  background:repeating-linear-gradient(180deg, #ECC880, #A27628 8px, #ECC880 16px);
  box-shadow:0 0 8px rgba(236,200,128,0.45);
}
.lantern-body{
  position:relative;
  width:46px;
  height:68px;
  border-radius:23px / 34px;
  background:radial-gradient(circle at 50% 45%, #FFEBAA 0%, #F5B838 40%, #B87214 85%, #603804 100%);
  border:1.5px solid #FCEFC7;
  box-shadow:
    0 12px 35px rgba(245, 184, 56, 0.5),
    0 0 25px rgba(255, 235, 170, 0.55),
    inset 0 0 12px rgba(255, 255, 255, 0.7);
}
.lantern-body::before{
  content:"";
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  width:26px;
  height:8px;
  border-radius:4px 4px 0 0;
  background:linear-gradient(90deg, #A27628, #FCEFC7, #A27628);
}
.lantern-body::after{
  content:"";
  position:absolute;
  bottom:-14px;
  left:50%;
  transform:translateX(-50%);
  width:16px;
  height:14px;
  clip-path:polygon(50% 0%, 0% 100%, 100% 100%);
  background:linear-gradient(180deg, #FCEFC7, #A27628);
}
.lantern-flame{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:14px;
  height:20px;
  border-radius:50% 50% 35% 35% / 60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 60%, #FFFFFF 0%, #FFF3B3 40%, #FF9000 80%, rgba(255,144,0,0) 100%);
  filter:drop-shadow(0 0 8px #FFAE00);
  animation:flame-flicker 2.4s ease-in-out infinite;
}
@keyframes lantern-sway{
  0%{transform:rotate(-3.5deg)}
  100%{transform:rotate(3.5deg)}
}
@keyframes flame-flicker{
  0%,100%{transform:translate(-50%, -50%) scale(1);opacity:0.95}
  50%{transform:translate(-50%, -52%) scale(1.15, 0.95);opacity:1}
  75%{transform:translate(-50%, -49%) scale(0.9, 1.05);opacity:0.85}
}

    box-shadow:0 15px 50px rgba(0,0,0,0.8), 0 0 0 1.5px rgba(212,175,55,0.7);
  }
}

/* Outer envelope ornate frame */
.envelope::before{
  content:"";
  position:absolute;
  inset:14px;
  border:1.5px solid rgba(212,175,55,0.65);
  border-radius:6px;
  pointer-events:none;
  z-index:1;
}
.envelope::after{
  content:"";
  position:absolute;
  inset:18px;
  border:1px dashed rgba(212,175,55,0.4);
  border-radius:4px;
  pointer-events:none;
  z-index:1;
}

/* Horizontal Gold Ribbon Band across Envelope */
.envelope-ribbon-h{
  position:absolute;
  left:0;
  right:0;
  top:var(--tip);
  height:16px;
  margin-top:-8px;
  background:linear-gradient(90deg, rgba(212,175,55,0.15) 0%, #C29B4A 15%, #FCEFC7 50%, #C29B4A 85%, rgba(212,175,55,0.15) 100%);
  box-shadow:0 2px 8px rgba(30,5,8,0.3);
  z-index:1;
}
.envelope-ribbon-h::after{
  content:"";
  position:absolute;
  inset:3px 0;
  border-top:1px dashed rgba(255,255,255,0.6);
  border-bottom:1px dashed rgba(255,255,255,0.6);
}

.flap{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:var(--tip);
  overflow:visible;
  transform-origin:50% 0;
  filter:drop-shadow(0 14px 22px rgba(30,6,10,0.55));
  transition:transform 1.1s cubic-bezier(0.55, 0, 0.2, 1) 0.1s, opacity 0.4s ease 0.85s;
  z-index:2;
}

/* 3D Realistic Royal Wax Seal */
.seal{
  position:absolute;
  z-index:10;
  left:50%;
  top:var(--tip);
  width:116px;
  height:116px;
  margin:-58px 0 0 -58px;
  padding:0;
  border:0;
  cursor:pointer;
  display:grid;
  place-items:center;
  border-radius:48% 52% 49% 51% / 51% 49% 52% 48%;
  color:#FFF0E6;
  background:radial-gradient(circle at 35% 30%, #F04856 0%, #BF2230 40%, #82121D 75%, #4A080F 100%);
  box-shadow:
    0 18px 42px rgba(35, 5, 10, 0.65),
    0 4px 14px rgba(0,0,0,0.4),
    inset 0 3px 6px rgba(255,255,255,0.6),
    inset 0 -6px 12px rgba(0,0,0,0.55);
  transition:transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
  animation:seal-in 0.95s 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}

.seal::before{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:50%;
  border:2px dashed rgba(255, 235, 205, 0.75);
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.5), 0 1px 2px rgba(255,255,255,0.4);
}

.seal::after{
  content:"";
  position:absolute;
  inset:-16px;
  border-radius:50%;
  border:2.5px solid rgba(212,175,55,0.85);
  opacity:0;
  animation:seal-pulse 2.8s 1.5s ease-out infinite;
}

.seal-ribbon{
  position:absolute;
  z-index:4;
  left:50%;
  top:calc(var(--tip) + 38px);
  width:50px;
  height:56px;
  margin-left:-25px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}
.seal-ribbon::before{
  content:"";
  width:20px;
  height:100%;
  background:linear-gradient(165deg, #FCEFC7 0%, #D4AF37 40%, #A07421 80%, #6E4A10 100%);
  clip-path:polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
  filter:drop-shadow(0 4px 8px rgba(35,8,10,0.5));
  transform:rotate(14deg);transform-origin:top center;
}
.seal-ribbon::after{
  content:"";
  width:20px;
  height:100%;
  background:linear-gradient(165deg, #DE3646 0%, #A81E2B 40%, #751019 80%, #4A080E 100%);
  clip-path:polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
  filter:drop-shadow(0 4px 8px rgba(35,8,10,0.5));
  transform:rotate(-14deg);transform-origin:top center;
}

.seal span{
  position:relative;
  font-family:var(--display);
  font-size:1.85rem;
  font-weight:600;
  line-height:1;
  letter-spacing:0.04em;
  background:linear-gradient(135deg, #FFFDF5 0%, #FCEFC7 30%, #D4AF37 60%, #996F1C 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,0.6));
}
.seal em{
  font-style:italic;
  font-family:var(--script);
  font-size:1.25em;
  margin:0 2px;
  vertical-align:0.08em;
}

.seal:hover{
  transform:scale(1.08) rotate(-1deg);
  box-shadow:
    0 24px 48px rgba(40, 6, 10, 0.75),
    0 6px 16px rgba(0,0,0,0.45),
    inset 0 3px 6px rgba(255,255,255,0.6),
    inset 0 -6px 12px rgba(0,0,0,0.5);
}

.op-text{
  position:absolute;
  left:0;
  right:0;
  top:calc(var(--tip) + 104px);
  padding:0 20px;
  text-align:center;
  transition:opacity 0.4s ease;
  z-index:5;
}
.op-invocation{
  margin:0 0 4px;
  font-family:var(--deva);
  font-size:1.05rem;
  letter-spacing:0.06em;
  color:var(--gold-ink);
  font-weight:600;
  animation:fade 0.9s 0.6s ease backwards;
}
.op-invite{
  margin:0;
  font-style:italic;
  font-size:1.1rem;
  color:var(--gold-ink);
  letter-spacing:0.03em;
  animation:fade 0.9s 0.8s ease backwards;
}
.op-names-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin:0.2em 0;
}
.op-flourish{
  font-size:1.35rem;
  color:var(--gold);
  filter:drop-shadow(0 1px 1px rgba(255,255,255,0.7));
  opacity:0.85;
}
.op-names{
  margin:0;
  font-family:var(--display);
  font-size:clamp(2.3rem, 8vw, 3.2rem);
  line-height:1.15;
  background:linear-gradient(135deg, #B52836 0%, #D84554 30%, #8A1520 70%, #5E0C13 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 8px rgba(158, 41, 54, 0.16));
  animation:fade 0.9s 1s ease backwards;
}
.op-names em{
  font-style:italic;
  font-family:var(--script);
  font-size:1.15em;
  background:var(--gold-foil);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.op-dates{
  margin:0;
  font-family:var(--royal);
  font-size:0.92rem;
  letter-spacing:0.12em;
  color:var(--gold-deep);
  animation:fade 0.9s 1.2s ease backwards;
}
.op-hint-badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin:1.4rem auto 0;
  padding:8px 24px;
  border-radius:999px;
  background:linear-gradient(135deg, #FFFDF8 0%, #FAF0E1 100%);
  border:1.5px solid rgba(212,175,55,0.7);
  box-shadow:
    0 4px 18px rgba(74,46,38,0.14),
    0 0 15px rgba(212,175,55,0.25),
    inset 0 1px 2px rgba(255,255,255,0.9);
  font-style:italic;
  font-size:1.05rem;
  color:var(--rose-deep);
  font-weight:600;
  cursor:pointer;
  animation:fade 0.8s 1.3s ease backwards, pulse-glow 2.8s 1.5s ease-in-out infinite;
  transition:all 0.3s ease;
}
.op-hint-badge:hover{
  transform:scale(1.05);
  box-shadow:0 6px 22px rgba(158, 41, 54, 0.25), 0 0 20px rgba(212,175,55,0.4);
}
.sparkle-icon{
  color:var(--gold);
  font-size:0.9rem;
  animation:sparkle-spin 3s linear infinite;
}
@keyframes sparkle-spin{
  0%,100%{transform:scale(1) rotate(0deg);opacity:0.8}
  50%{transform:scale(1.3) rotate(90deg);opacity:1}
}

/* Light burst when seal opens */
.glow{
  position:fixed;
  z-index:50;
  left:50%;
  top:50%;
  width:40px;
  height:40px;
  margin:-20px 0 0 -20px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle, #FFFDF0 0%, #FEE8B0 35%, #E9B854 65%, rgba(212,175,55,0) 80%);
  transform:scale(0);
  opacity:0;
  transition:transform 1.15s cubic-bezier(0.7,0,0.3,1) 0.35s, opacity 0.35s ease 0.35s;
}

.is-opening .flap{transform:rotateX(175deg);opacity:0}
.is-opening .seal{transform:scale(1.22);opacity:0}
.is-opening .seal-ribbon{opacity:0;transition:opacity 0.3s ease}
.is-opening .envelope-ribbon-h{opacity:0;transition:opacity 0.3s ease}
.is-opening .op-text{opacity:0}
.is-opening .glow{transform:scale(var(--s, 65));opacity:1}

/* ==========================================================================
   PETALS & GOLDEN SPARKLES
   ========================================================================== */
.petals{position:fixed;inset:0;z-index:120;overflow:hidden;pointer-events:none}
.petal{
  position:absolute;
  top:-6vh;
  left:var(--x);
  animation:fall var(--dur) linear var(--delay) var(--loop) both;
}
.petal i{
  display:block;
  width:var(--size);
  height:calc(var(--size) * 1.3);
  border-radius:150% 0 150% 0;
  background:var(--c);
  filter:drop-shadow(0 2px 4px rgba(60,20,15,0.15));
  animation:sway var(--sway) ease-in-out infinite alternate;
}
.petal.sparkle i{
  border-radius:50%;
  width:calc(var(--size) * 0.75);
  height:calc(var(--size) * 0.75);
  background:radial-gradient(circle, #FFF 0%, #FFD777 50%, #C49448 100%);
  box-shadow:0 0 8px #FFD777;
}
.petals.is-paused .petal,.petals.is-paused .petal i{animation-play-state:paused}

/* ==========================================================================
   LAYOUT & LUXURY WEDDING CARDS
   ========================================================================== */
main{position:relative;z-index:1;overflow-x:clip}
.scene{padding:clamp(60px, 9vw, 110px) 18px}
.column{max-width:38rem;margin:0 auto;text-align:center}

.card{
  position:relative;
  max-width:38rem;
  margin:0 auto;
  text-align:center;
  transition:transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
}

/* Royal Indian Invitation Paper Card */
.paper{
  --accent:var(--ink);
  padding:clamp(44px, 7vw, 64px) clamp(22px, 6vw, 48px);
  border-radius:10px;
  background:linear-gradient(172deg, #FFFFFF 0%, #FCF8F0 50%, #FAF0DF 100%);
  box-shadow:
    0 24px 60px -10px rgba(60, 20, 15, 0.18),
    0 4px 18px rgba(0, 0, 0, 0.05),
    0 0 0 1px rgba(212, 175, 55, 0.4),
    inset 0 0 45px rgba(212, 175, 55, 0.05);
  border:2px solid rgba(212, 175, 55, 0.45);
}

.paper:hover{
  transform:translateY(-3px);
  box-shadow:
    0 30px 75px -10px rgba(60, 20, 15, 0.24),
    0 6px 20px rgba(0, 0, 0, 0.06),
    0 0 0 1.5px rgba(212, 175, 55, 0.65);
}

/* Double gold decorative inner border */
.paper::before{
  content:"";
  position:absolute;
  inset:12px;
  border:1px solid rgba(212, 175, 55, 0.65);
  border-radius:6px;
  pointer-events:none;
}
.paper::after{
  content:"";
  position:absolute;
  inset:16px;
  border:1px dashed rgba(212, 175, 55, 0.35);
  border-radius:4px;
  pointer-events:none;
}

/* Ornate corner filigrees */
.corner{
  position:absolute;
  width:36px;
  height:36px;
  color:var(--gold);
  filter:drop-shadow(0 1px 1px rgba(255,255,255,0.7));
  pointer-events:none;
}
.c-tl{top:6px;left:6px}
.c-tr{top:6px;right:6px;transform:scaleX(-1)}
.c-bl{bottom:6px;left:6px;transform:scaleY(-1)}
.c-br{bottom:6px;right:6px;transform:scale(-1)}

/* Decorative rule with lotus/heart emblem */
.rule{
  display:block;
  width:140px;
  height:18px;
  margin:14px auto 18px;
  color:var(--accent, var(--gold));
}

.script{
  margin:0;
  font-family:var(--script);
  font-weight:400;
  font-size:clamp(2.8rem, 10vw, 3.8rem);
  line-height:1.15;
  background:linear-gradient(135deg, #8A1520 0%, #B82838 50%, #700E17 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 2px rgba(122, 29, 39, 0.15));
}

/* Illustrations with smooth blended edges */
.art{
  --f:7%;
  width:100%;
  background-repeat:no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 var(--f),#000 calc(100% - var(--f)),transparent),linear-gradient(180deg,transparent,#000 var(--f),#000 calc(100% - var(--f)),transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 var(--f),#000 calc(100% - var(--f)),transparent),linear-gradient(180deg,transparent,#000 var(--f),#000 calc(100% - var(--f)),transparent);
  mask-composite:intersect;
}
.art--blend{--f:14%}
.art--missing{
  display:grid;
  place-items:center;
  min-height:140px;
  border:1px dashed var(--gold);
  background-image:none!important;
  -webkit-mask-image:none;
  mask-image:none;
}
.art--missing::after{
  content:attr(data-missing);
  padding:12px;
  font-style:italic;
  font-size:0.95rem;
  color:var(--gold-ink);
}

/* ==========================================================================
   SCENE 2: BLESSING CARD (HERO)
   ========================================================================== */
.scene--blessing{
  min-height:100vh;
  min-height:100svh;
  display:flex;
  align-items:center;
}
.framed{
  position:relative;
  width:100%;
  max-width:38rem;
  margin:0 auto;
  padding:clamp(54px, 10vw, 84px) clamp(24px, 7vw, 56px);
  text-align:center;
  background:linear-gradient(172deg, #FFFFFF 0%, #FCF8F0 50%, #FAF0DF 100%);
  border-radius:10px;
  box-shadow:
    0 26px 65px -10px rgba(60, 20, 15, 0.22),
    0 4px 18px rgba(0, 0, 0, 0.05),
    0 0 0 1px rgba(212, 175, 55, 0.45),
    inset 0 0 55px rgba(212, 175, 55, 0.06);
  border:2px solid rgba(212, 175, 55, 0.5);
}

.framed::before{
  content:"";
  position:absolute;
  inset:14px;
  border:1px solid rgba(212,175,55,0.7);
  border-radius:6px;
  pointer-events:none;
}
.framed::after{
  content:"";
  position:absolute;
  inset:18px;
  border:1px dashed rgba(212,175,55,0.4);
  border-radius:4px;
  pointer-events:none;
}

/* Arched Ganesha frame */
.ganesh{
  width:clamp(116px, 28vw, 154px);
  margin:0 auto 24px;
  padding:12px;
  border-radius:75px 75px 14px 14px;
  background:radial-gradient(circle at 50% 35%, rgba(255,248,225,0.95) 0%, rgba(246,232,200,0.5) 60%, rgba(212,175,55,0.2) 100%);
  border:2px solid rgba(212,175,55,0.75);
  box-shadow:
    0 10px 30px rgba(184, 44, 55, 0.15),
    0 0 20px rgba(212, 175, 55, 0.25),
    inset 0 0 15px rgba(255,255,255,0.8);
}

.shloka{
  margin:0 auto 24px;
  max-width:32rem;
  font-family:var(--deva);
  font-size:clamp(1.1rem, 4vw, 1.35rem);
  line-height:1.9;
  color:var(--rose-deep);
  font-weight:500;
  letter-spacing:0.02em;
}
.shloka span,.parents span,.lineage span{display:block}

.blessing-line{
  max-width:30rem;
  margin:0 auto 28px;
  font-style:italic;
  font-size:clamp(1.15rem, 4vw, 1.35rem);
  line-height:1.8;
  color:var(--ink-soft);
}

.names{
  margin:0;
  font-weight:400;
  display:flex;
  flex-direction:column;
  align-items:center;
}
#couple-names:focus{outline:none}

.name{
  font-family:var(--display);
  font-size:clamp(2.4rem, 11vw, 4.2rem);
  line-height:1.1;
  background:linear-gradient(135deg, #9E2936 0%, #C43846 45%, #7A1D27 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 4px rgba(122, 29, 39, 0.12));
}

.amp{
  display:flex;
  align-items:center;
  gap:18px;
  margin:0.2em 0;
  font-family:var(--script);
  font-size:clamp(2.2rem, 7vw, 2.8rem);
  line-height:1;
  color:var(--gold);
}
.amp::before,.amp::after{
  content:"";
  width:clamp(60px, 18vw, 120px);
  height:1.5px;
  background:var(--gold-border);
}

.parents{
  margin:32px 0 0;
  font-style:italic;
  font-size:1.18rem;
  line-height:1.65;
  color:var(--rose-deep);
}

/* ==========================================================================
   SCENE 3: OUR STORY & LAYERED PHOTOGRAPH STACK ANIMATION
   ========================================================================== */
.lang-switch{
  display:inline-flex;
  gap:4px;
  margin:0 auto 28px;
  padding:4px;
  background:rgba(255,255,255,0.7);
  border:1px solid rgba(192,144,74,0.55);
  border-radius:999px;
  box-shadow:0 2px 8px rgba(74,46,38,0.06);
}
.lang-switch button{
  min-height:38px;
  padding:4px 18px;
  border:0;
  border-radius:999px;
  background:transparent;
  color:var(--ink);
  font:inherit;
  font-size:1rem;
  font-weight:500;
  cursor:pointer;
  transition:all 0.25s ease;
}
.lang-switch button[aria-pressed="true"]{
  background:#9E2936;
  background:linear-gradient(135deg, #A82F3B 0%, #821D27 100%);
  color:#FFFFFF !important;
  font-weight:600;
  box-shadow:0 2px 8px rgba(158, 41, 54, 0.4);
}
.lang-switch button:not([aria-pressed="true"]):hover{
  background:rgba(192,144,74,0.15);
  color:var(--rose-deep);
}

.story-title{
  margin:0;
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(2.3rem, 8.5vw, 3.3rem);
  line-height:1.12;
  color:var(--rose);
}
.story-couple{
  margin:0.3em 0 0;
  font-style:italic;
  font-size:1.3rem;
  color:var(--gold-ink);
}
.story-sub{
  margin:0 auto;
  max-width:30rem;
  font-style:italic;
  font-size:1.22rem;
  color:var(--ink-soft);
}

/* Scroll-Driven Overlapping Story Cards Stack */
#story .column{max-width:58rem}

.story-scroll-stack{
  position:relative;
  max-width:54rem;
  margin:32px auto 0;
  display:flex;
  flex-direction:column;
  padding-bottom:10px;
}

.story-stack-card{
  position:sticky;
  top:clamp(50px, calc(50vh - 190px), 110px);
  margin-bottom:clamp(140px, 36vh, 260px);
  width:100%;
  background:linear-gradient(172deg, #FFFFFF 0%, #FCF8F1 50%, #FAF0DF 100%);
  border-radius:12px;
  border:2px solid rgba(212, 175, 55, 0.5);
  box-shadow:
    0 -10px 30px rgba(50, 15, 10, 0.16),
    0 28px 70px -10px rgba(50, 15, 10, 0.36),
    0 0 0 1px rgba(212, 175, 55, 0.4),
    inset 0 0 40px rgba(212, 175, 55, 0.04);
  padding:28px 32px;
  transform-origin:center top;
}

.story-stack-card:nth-child(1){ z-index:1; }
.story-stack-card:nth-child(2){ z-index:2; }
.story-stack-card:nth-child(3){ z-index:3; }
.story-stack-card:nth-child(4){ z-index:4; }
.story-stack-card:nth-child(5){ z-index:5; margin-bottom:0; }

.story-card-badge-wrap{margin-bottom:12px;text-align:center}
.story-card-badge{
  display:inline-block;
  padding:4px 18px;
  font-family:var(--royal);
  font-size:0.82rem;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--gold-ink);
  background:rgba(212,175,55,0.12);
  border:1px solid rgba(212,175,55,0.45);
  border-radius:999px;
  box-shadow:inset 0 1px 2px rgba(255,255,255,0.6);
}

.story-card-art{
  max-width:30rem;
  margin:0 auto 16px;
  border-radius:6px;
  overflow:hidden;
}
.story-card-art .art{
  width:100%;
  --f:7%;
  border-radius:6px;
}

.story-card-body p{
  margin:0 auto;
  font-size:1.15rem;
  line-height:1.8;
  text-align:left;
  color:var(--ink);
}
.story-card-body strong{
  font-weight:600;
  color:var(--rose);
}
.story-card-body p + p{
  margin-top:10px;
}

/* PC / Desktop 2-Column Book Layout */
@media (min-width: 820px){
  #story .column{max-width:58rem}
  .story-scroll-stack{max-width:54rem}
  .story-stack-card{
    display:grid;
    grid-template-columns:1fr 1.15fr;
    gap:32px;
    align-items:center;
    text-align:left;
    padding:30px 36px;
    top:clamp(60px, calc(50vh - 200px), 120px);
    margin-bottom:clamp(160px, 42vh, 280px);
  }
  .story-card-art{
    max-width:none;
    margin:0;
  }
  .story-card-art .art{
    max-height:360px;
    border-radius:6px;
  }
  .story-card-content{
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .story-card-badge-wrap{
    text-align:left;
    margin-bottom:12px;
  }
  .story-card-body{
    margin-top:0;
  }
  .story-card-body p{
    margin:0;
    max-width:none;
    font-size:1.15rem;
    line-height:1.85;
    text-align:left;
  }
  .story-card-body p + p{
    margin-top:12px;
  }
}

/* Mobile Screens (< 820px) */
@media (max-width: 819px){
  .story-scroll-stack{max-width:28rem}
  .story-stack-card{
    display:flex;
    flex-direction:column;
    padding:20px 18px;
    top:clamp(45px, 7vh, 75px);
    margin-bottom:clamp(120px, 28vh, 200px);
    text-align:center;
  }
  .story-card-badge-wrap{
    text-align:center;
    margin-bottom:12px;
  }
  .story-card-art{
    max-width:22rem;
    margin:0 auto 12px;
  }
  .story-card-art .art{
    max-height:clamp(170px, 28vh, 230px);
    border-radius:4px;
  }
  .story-card-body p{
    font-size:1.05rem;
    line-height:1.65;
    text-align:center;
  }
}

/* Narrative text flow */
.story-flow{margin-top:36px}
.story-flow p{
  margin:0 auto 1.5em;
  max-width:34rem;
  text-align:left;
  font-size:1.15rem;
  line-height:1.8;
}
.story-flow p:first-of-type::first-letter{
  float:left;
  font-family:var(--display);
  font-size:3.2rem;
  line-height:0.85;
  padding-top:4px;
  padding-right:10px;
  padding-bottom:2px;
  color:var(--rose);
}
.story-flow strong{font-weight:600;color:var(--rose)}
.story-art{max-width:30rem;margin:0.8em auto 2.4em}

/* ==========================================================================
   SCENE 4: OUR WEDDING & CEREMONIES
   ========================================================================== */
.couple-cols{
  display:grid;
  grid-template-columns:1fr 1px 1fr;
  gap:0 18px;
  align-items:start;
  margin:8px 0 16px;
}
.couple-cols::before{
  content:"";
  grid-column:2;
  grid-row:1;
  align-self:stretch;
  background:linear-gradient(180deg, transparent, rgba(212,175,55,0.7) 15%, rgba(212,175,55,0.7) 85%, transparent);
}
.script.role{font-size:2rem;line-height:1.2;color:var(--rose)}
.person{
  margin:2px 0 0;
  font-family:var(--display);
  font-size:1.3rem;
  font-weight:400;
  line-height:1.3;
  color:var(--ink);
}
.lineage{margin:4px 0 0;font-size:1.02rem;line-height:1.45;color:var(--ink-soft)}
.card .art{max-width:24rem;margin:20px auto 0}

.card-date{
  margin:22px 0 0;
  font-family:var(--royal);
  font-size:1.25rem;
  letter-spacing:0.06em;
  color:var(--gold-ink);
}
.card .rule + .card-date{margin-top:0}
.card-time{margin:2px 0 0;font-style:italic;color:var(--ink-soft)}

.ornament{
  margin:0 0 -4px;
  font-family:var(--deva);
  font-size:2.2rem;
  line-height:1.2;
  color:var(--accent);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,0.1));
}

.save-label{
  margin:18px 0 8px;
  font-style:italic;
  font-size:1.15rem;
  color:var(--gold-ink);
}

/* Luxury 4-box Countdown Clock */
.countdown{
  display:flex;
  justify-content:center;
  gap:clamp(8px, 2.5vw, 14px);
  margin:12px 0 0;
}
.cd{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:clamp(3.8rem, 18vw, 4.8rem);
  padding:12px 10px;
  border-radius:8px;
  background:linear-gradient(180deg, #FFFFFF 0%, #FDF8EE 100%);
  border:1.5px solid rgba(212,175,55,0.6);
  box-shadow:
    0 6px 16px rgba(74,46,38,0.08),
    0 0 10px rgba(212,175,55,0.18),
    inset 0 1px 2px rgba(255,255,255,0.9);
  transition:transform 0.3s ease;
}
.cd:hover{
  transform:translateY(-2px);
  border-color:rgba(212,175,55,0.85);
}
.cd-n{
  font-family:var(--display);
  font-size:clamp(1.9rem, 6.5vw, 2.5rem);
  line-height:1.05;
  color:var(--rose);
  font-variant-numeric:tabular-nums;
  filter:drop-shadow(0 1px 2px rgba(158, 41, 54, 0.15));
}
.cd-l{
  font-family:var(--royal);
  font-size:0.75rem;
  letter-spacing:0.12em;
  text-transform:uppercase;
  line-height:1.3;
  color:var(--gold-ink);
  font-weight:600;
  margin-top:4px;
}
.countdown-msg{margin:12px 0 0;font-style:italic;font-size:1.3rem;color:var(--rose)}
.countdown-msg:empty{display:none}

/* Ceremonies Grid */
.events-grid{
  display:grid;
  gap:clamp(28px, 5vw, 44px);
  max-width:64rem;
  margin:0 auto;
}
.events-grid .card{width:100%}
@media (min-width:760px){
  .events-grid{grid-template-columns:1fr 1fr}
  .events-grid .card{
    width:100%;
    max-width:none;
    margin:0;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
}

/* Event Card Badge */
.event-badge{
  display:inline-block;
  margin-bottom:8px;
  padding:4px 16px;
  border-radius:999px;
  font-family:var(--royal);
  font-size:0.8rem;
  letter-spacing:0.1em;
  text-transform:uppercase;
  background:rgba(212,175,55,0.14);
  border:1px solid currentColor;
}

/* ==========================================================================
   SCENE 5: VENUE
   ========================================================================== */
.pin{
  display:block;
  width:26px;
  height:34px;
  margin:0 auto 6px;
  color:var(--gold);
  filter:drop-shadow(0 2px 4px rgba(74,46,38,0.15));
}
.venue-name{
  margin:0;
  font-family:var(--display);
  font-size:1.75rem;
  font-weight:400;
  line-height:1.25;
}
.venue-city{margin:2px 0 0;font-size:1.35rem;color:var(--gold-ink)}
.venue-address{
  margin:10px auto 0;
  max-width:24rem;
  font-style:italic;
  font-size:1.05rem;
  line-height:1.6;
  color:var(--ink-soft);
}
.map{
  max-width:28rem;
  margin:22px auto 0;
  aspect-ratio:4/3;
  border-radius:6px;
  overflow:hidden;
  border:1.5px solid rgba(192,144,74,0.5);
  box-shadow:0 8px 24px rgba(74,46,38,0.1);
}
.map iframe{display:block;width:100%;height:100%;border:0}

/* ==========================================================================
   BUTTONS
   ========================================================================== */
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:10px 26px;
  border:1px solid rgba(212,175,55,0.6);
  border-radius:999px;
  background:#9E2936;
  background:linear-gradient(135deg, #A82F3B 0%, #821D27 100%);
  color:#FFFFFF !important;
  font-family:var(--serif);
  font-size:1.08rem;
  font-weight:500;
  line-height:1.2;
  text-decoration:none;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(158, 41, 54, 0.35);
  transition:all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.btn:hover{
  background:linear-gradient(135deg, #B53241 0%, #8E212B 100%);
  color:#FFFFFF !important;
  transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(158, 41, 54, 0.45);
}
.btn--quiet{
  background:#FFFFFF;
  color:var(--rose-deep) !important;
  border:1.5px solid rgba(192,144,74,0.65);
  font-weight:500;
  box-shadow:0 2px 8px rgba(74,46,38,0.06);
}
.btn--quiet:hover{
  background:#FFFDF9;
  color:var(--rose) !important;
  border-color:var(--rose);
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(158, 41, 54, 0.15);
}
.btn--wide{width:100%}
.btn:disabled{opacity:0.6;cursor:progress}

/* ==========================================================================
   SCENE 6: CLOSING
   ========================================================================== */
.closing-title{
  margin:0;
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(2.1rem, 8vw, 2.9rem);
  line-height:1.15;
  color:var(--rose);
}
.closing-sub{
  margin:14px auto 0;
  max-width:28rem;
  font-style:italic;
  font-size:1.25rem;
  line-height:1.7;
}
.closing-names{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:6px 14px;
  margin:30px 0 0;
  font-family:var(--display);
  font-size:clamp(1.6rem, 6vw, 2rem);
  line-height:1.3;
  color:var(--rose);
}
.closing-names .heart{
  width:24px;
  height:20px;
  color:var(--rose);
  animation:heart-beat 1.8s ease-in-out infinite;
}
.closing-end{
  margin:24px auto 0;
  max-width:28rem;
  font-style:italic;
  font-size:1.1rem;
  color:var(--ink-soft);
}
.share-status{
  margin-top:10px;
  font-size:0.95rem;
  color:var(--gold-ink);
  word-break:break-all;
}

/* Floating Music Button */
.music{
  position:fixed;
  z-index:50;
  right:calc(16px + env(safe-area-inset-right));
  bottom:calc(16px + env(safe-area-inset-bottom));
  width:50px;
  height:50px;
  display:grid;
  place-items:center;
  border:1.5px solid var(--gold);
  border-radius:50%;
  background:rgba(255,255,255,0.92);
  color:var(--rose);
  box-shadow:0 6px 18px rgba(74,46,38,0.2);
  cursor:pointer;
  transition:all 0.25s ease;
}
.music:hover{transform:scale(1.08)}
.music svg{width:22px;height:22px}
.music .i-pause,.music.is-on .i-note{display:none}
.music.is-on .i-pause{display:block}

/* Reveal Animations */
.js .seq{
  opacity:0;
  transform:translateY(12px);
  transition:opacity 0.9s ease, transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
  transition-delay:calc(var(--i,0) * 170ms + 120ms);
}
.js .is-shown .seq{opacity:1;transform:none}
.js .fade{opacity:0;transition:opacity 1s ease}
.js .fade.is-in{opacity:1}

@keyframes fade{from{opacity:0}}
@keyframes seal-in{from{opacity:0;transform:scale(0.7) rotate(-14deg)}}
@keyframes seal-pulse{from{opacity:0.85;transform:scale(1)}to{opacity:0;transform:scale(1.55)}}
@keyframes pulse-glow{0%,100%{box-shadow:0 4px 14px rgba(74,46,38,0.08)} 50%{box-shadow:0 4px 20px rgba(212,175,55,0.35);border-color:rgba(212,175,55,0.8)}}
@keyframes heart-beat{0%,100%{transform:scale(1)} 25%{transform:scale(1.15)} 40%{transform:scale(1)}}
@keyframes fall{
  0%{transform:translate3d(0,0,0);opacity:0}
  8%{opacity:1}
  85%{opacity:1}
  100%{transform:translate3d(0,114vh,0);opacity:0}
}
@keyframes sway{from{transform:translateX(-18px) rotate(-35deg)}to{transform:translateX(22px) rotate(165deg)}}

@media (max-height:480px){
  :root{--tip:34vh}
  .seal{width:90px;height:90px;margin:-54px 0 0 -45px}
  .op-text{top:calc(var(--tip) + 55px)}
  .op-names{font-size:2.1rem}
  .op-hint-badge{margin-top:1rem}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:0.01ms!important;
    animation-delay:0s!important;
    animation-iteration-count:1!important;
    transition-duration:0.01ms!important;
    transition-delay:0s!important;
  }
  .petals{display:none}
}

[lang="hi"],[lang="mr"],[lang="sa"]{font-style:normal;line-height:1.9}
</style>
</head>
<body>
<noscript><p class="noscript">Please turn on JavaScript to open this royal wedding invitation.</p></noscript>

<!-- SVG Sprites and Gradient Defs -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gold-grad-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC880"/>
      <stop offset="50%" stop-color="#C29B4A"/>
      <stop offset="100%" stop-color="#8F6322"/>
    </linearGradient>
  </defs>

  </symbol>
  <symbol id="i-heart" viewBox="51 0 18 15">
    <path d="M60 13.5c-4.5-3-8-5.6-8-8.6 0-1.9 1.5-3.4 3.4-3.4 1.9 0 3.2 1 4.6 2.6 1.4-1.6 2.7-2.6 4.6-2.6 1.9 0 3.4 1.5 3.4 3.4 0 3-3.5 5.6-8 8.6z" fill="currentColor"/>
  </symbol>
  <symbol id="i-corner" viewBox="0 0 40 40">

      <path d="M3 32V11a8 8 0 0 1 8-8h21"/>
      <path d="M9 19c0-5.5 4.5-10 10-10"/>
      <path d="M14 14c3-4 8-4 10 0-3 2-7 2-10 0zM14 14c-4 3-4 8 0 10 2-3 2-7 0-10z"/>
    </g>
    <circle cx="14" cy="14" r="1.8" fill="currentColor"/>
  </symbol>
  <symbol id="i-pin" viewBox="0 0 24 32">
    <path d="M12 31s10-11.2 10-19A10 10 0 0 0 2 12c0 7.8 10 19 10 19z" fill="currentColor"/>
    <circle cx="12" cy="12" r="3.6" fill="#FAF4EA"/>

  <symbol id="i-pause" viewBox="0 0 24 24">

    <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>
  </symbol>
</svg>

<!-- SCENE 1: ENVELOPE OPENING -->
<div class="opening" id="opening" role="dialog" aria-modal="true" aria-labelledby="op-names" aria-describedby="op-hint">
  <!-- Royal Palace Swaying Diyas / Lanterns -->
  <div class="opening-lantern lantern-left" aria-hidden="true">
    <div class="lantern-chain"></div>
    <div class="lantern-body"><div class="lantern-flame"></div></div>
  </div>
  <div class="opening-lantern lantern-right" aria-hidden="true">
    <div class="lantern-chain"></div>
    <div class="lantern-body"><div class="lantern-flame"></div></div>
  </div>

  <div class="envelope">
    <!-- Corner ornaments -->
    <svg class="corner c-tl" aria-hidden="true"><use href="#i-corner"/></svg>
    <svg class="corner c-tr" aria-hidden="true"><use href="#i-corner"/></svg>
    <svg class="corner c-bl" aria-hidden="true"><use href="#i-corner"/></svg>
    <svg class="corner c-br" aria-hidden="true"><use href="#i-corner"/></svg>

    <!-- Horizontal Satin Gold Ribbon Band -->
    <div class="envelope-ribbon-h" aria-hidden="true"></div>

    <!-- Mughal Scalloped Arch Velvet Flap -->
    <svg class="flap" viewBox="0 0 100 52" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="flap-velvet" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#9E202B"/>
          <stop offset="50%" stop-color="#78141E"/>
          <stop offset="100%" stop-color="#4E080F"/>
        </linearGradient>
      </defs>
      <!-- Main Crimson Velvet Flap Body -->
      <path d="M0 0 H100 L100 6 C88 6 82 12 74 20 C66 28 58 46 50 50 C42 46 34 28 26 20 C18 12 12 6 0 6 Z" fill="url(#flap-velvet)"/>
      <!-- Outer Gold Foil Scalloped Border -->
      <path d="M0 0 H100 L100 6 C88 6 82 12 74 20 C66 28 58 46 50 50 C42 46 34 28 26 20 C18 12 12 6 0 6 Z" fill="none" stroke="url(#gold-grad-stroke)" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
      <!-- Inner Gold Zari Embroidery -->
      <path d="M4 0 L96 0 L96 5 C85 5 79 11 71 18 C63 26 57 42 50 45 C43 42 37 26 29 18 C21 11 15 5 4 5 Z" fill="none" stroke="url(#gold-grad-stroke)" stroke-width="0.75" stroke-dasharray="1.2 1.4" vector-effect="non-scaling-stroke"/>
      <!-- Centered Gold Lotus Crest on Flap -->
      <circle cx="50" cy="18" r="8" fill="rgba(212,175,55,0.18)" stroke="url(#gold-grad-stroke)" stroke-width="0.8" vector-effect="non-scaling-stroke"/>
      <path d="M50 12 Q54 18 50 24 Q46 18 50 12 Z" fill="url(#gold-grad-stroke)"/>
      <path d="M44 18 Q50 22 56 18 Q50 14 44 18 Z" fill="url(#gold-grad-stroke)"/>
      <circle cx="50" cy="18" r="1.5" fill="#FFF"/>
    </svg>

    <!-- Satin Gold & Crimson Ribbon Tails -->
    <div class="seal-ribbon" aria-hidden="true"></div>

    <!-- 3D Ruby & Gold Wax Seal -->
    <button class="seal" id="seal" type="button" aria-label="Open the wedding invitation">
      <span aria-hidden="true"></span>
    </button>

    <!-- Royal Envelope Typography -->
    <div class="op-text">
      <p class="op-invocation" data-text="opening.invocation"></p>
      <p class="op-invite" data-text="opening.invite"></p>
      <div class="op-names-wrap">
        <span class="op-flourish" aria-hidden="true">❦</span>
        <h1 class="op-names" id="op-names"><span data-text="groomShort"></span> <em>&amp;</em> <span data-text="brideShort"></span></h1>
        <span class="op-flourish" aria-hidden="true">❦</span>
      </div>
      <p class="op-dates" data-text="opening.dates"></p>
      <div class="op-hint-badge" id="op-hint" role="button" tabindex="0">
        <span class="sparkle-icon" aria-hidden="true">✦</span>
        <span data-text="opening.hint"></span>
        <span class="sparkle-icon" aria-hidden="true">✦</span>
      </div>
    </div>
  </div>
  <div class="glow" id="glow" aria-hidden="true"></div>
</div>

<!-- Floating Petals & Golden Shimmer (Visible from start) -->
<div class="petals" id="petals" aria-hidden="true"></div>

<!-- MAIN CONTENT -->
<main id="main">
  <!-- SCENE 2: BLESSING CARD (HERO) -->
  <section class="scene scene--blessing" id="blessing" data-sequence aria-labelledby="couple-names">
    <div class="framed">
      <div class="ganesh seq" id="ganesh" style="--i:0"></div>
      <p class="shloka seq" id="shloka" lang="sa" style="--i:1"></p>
      <p class="blessing-line seq" data-text="blessing.line" style="--i:2"></p>
      <h1 class="names" id="couple-names" tabindex="-1">
        <span class="name seq" data-text="groomName" style="--i:3"></span>
        <span class="amp seq" style="--i:4">&amp;</span>
        <span class="name seq" data-text="brideName" style="--i:5"></span>
      </h1>
      <p class="parents seq" id="parents" style="--i:6"></p>
    </div>
  </section>

  <!-- SCENE 3: OUR STORY & LAYERED PHOTOGRAPH STACK -->
  <section class="scene" id="story" aria-labelledby="story-title">
    <div class="column">
      <div class="lang-switch fade" id="lang-switch" role="group" aria-label="Story language"></div>
      <h2 class="story-title fade" id="story-title"></h2>
      <p class="story-couple fade" id="story-couple"></p>
      <svg class="rule fade" aria-hidden="true"><use href="#i-heart-rule"/></svg>
      <p class="story-sub fade" id="story-sub"></p>

      <!-- Scroll-Driven Overlapping Story Stack -->
      <div class="story-scroll-stack" id="story-stack"></div>
    </div>
  </section>

  <!-- SCENE 4: OUR WEDDING -->
  <section class="scene" id="wedding" aria-labelledby="wedding-title">
    <article class="card paper fade" id="wedding-card">
      <h2 class="script" id="wedding-title">Our Wedding</h2>
      <svg class="rule" aria-hidden="true"><use href="#i-heart-rule"/></svg>
      <div class="couple-cols">
        <div><p class="script role">Groom</p><p class="person" data-text="groomName"></p><p class="lineage" id="groom-lines"></p></div>
        <div><p class="script role">Bride</p><p class="person" data-text="brideName"></p><p class="lineage" id="bride-lines"></p></div>
      </div>
      <div id="wedding-art"></div>
      <p class="card-date" id="wedding-date"></p>
      <p class="save-label" id="save-label">The auspicious muhurat begins in</p>
      <div class="countdown" id="countdown" role="timer" aria-label="Time left until the wedding">
        <span class="cd"><span class="cd-n" id="cd-d">0</span><span class="cd-l">days</span></span>
        <span class="cd"><span class="cd-n" id="cd-h">00</span><span class="cd-l">hours</span></span>
        <span class="cd"><span class="cd-n" id="cd-m">00</span><span class="cd-l">mins</span></span>
        <span class="cd"><span class="cd-n" id="cd-s">00</span><span class="cd-l">secs</span></span>
      </div>
      <p class="countdown-msg" id="countdown-msg" aria-live="polite"></p>
      <div class="actions" id="cal-actions">
        <a class="btn" id="gcal" href="#" target="_blank" rel="noopener">Add to Google Calendar</a>
        <button class="btn btn--quiet" id="ics" type="button">Add to Apple / Outlook Calendar</button>
      </div>
    </article>
  </section>

  <!-- SCENE 5: CEREMONIES -->
  <section class="scene" id="events" aria-labelledby="events-title">
    <h2 class="sr-only" id="events-title">Wedding Ceremonies</h2>
    <div class="events-grid" id="events-grid"></div>
  </section>

  <!-- SCENE 6: VENUE -->
  <section class="scene" id="venue" aria-labelledby="venue-title">
    <article class="card paper fade" id="venue-card">
      <svg class="pin" aria-hidden="true"><use href="#i-pin"/></svg>
      <h2 class="script" id="venue-title">Venue</h2>
      <svg class="rule" aria-hidden="true"><use href="#i-heart-rule"/></svg>
      <p class="venue-name" data-text="venue.name"></p>
      <p class="venue-city" data-text="venue.city"></p>
      <p class="venue-address" data-text="venue.address"></p>
      <div id="venue-art"></div>
      <div class="map" id="venue-map" hidden></div>
      <div class="actions"><a class="btn" id="directions" href="#" target="_blank" rel="noopener">Get Directions</a></div>
    </article>
  </section>

  <!-- SCENE 7: CLOSING -->
  <section class="scene" id="closing" aria-labelledby="closing-title">
    <div class="card paper fade">
      <h2 class="closing-title" id="closing-title"></h2>
      <p class="closing-sub" id="closing-sub"></p>
      <p class="closing-names" id="closing-names"></p>
      <p class="closing-end" id="closing-end"></p>
      <div class="actions"><button class="btn btn--quiet" id="share" type="button">Share Invitation</button></div>
      <p class="status share-status" id="share-status" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>

<!-- Floating Audio Toggle -->
<button class="music" id="music" type="button" aria-label="Background music" aria-pressed="false" hidden>
  <svg class="i-note" aria-hidden="true"><use href="#i-note"/></svg>
  <svg class="i-pause" aria-hidden="true"><use href="#i-pause"/></svg>
</button>
<audio id="bg-music" loop preload="none"></audio>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const icon = (id, cls) => {
    const NS = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(NS, 'svg'), u = document.createElementNS(NS, 'use');
    s.setAttribute('class', cls);
    s.setAttribute('aria-hidden', 'true');
    u.setAttribute('href', '#' + id);
    s.append(u);
    return s;
  };

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pad = n => String(n).padStart(2, '0');
  const get = path => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), CONFIG);
  const toDate = s => { const d = new Date(s); return isNaN(d.getTime()) ? null : d; };
  const isDeva = t => /[\u0900-\u097F]/.test(t || '');
  const initial = s => (String(s || '').trim().charAt(0) || '').toUpperCase();
  const ymd = iso => /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  const dmy = iso => { const m = ymd(iso); return m ? `${m[3]} - ${m[2]} - ${m[1]}` : ''; };
  const spoken = (iso, opts) => {
    const m = ymd(iso); if (!m) return '';
    return new Intl.DateTimeFormat('en-IN', Object.assign({ timeZone: 'UTC' }, opts)).format(new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12)));
  };

  let start = null, end = null;
  const storyParas = [];

  function dateInto(p, iso) {
    p.textContent = '';
    const v = el('span', '', dmy(iso)); v.setAttribute('aria-hidden', 'true');
    p.append(v, el('span', 'sr-only', spoken(iso, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })));
    return p;
  }
  function rich(text) {
    const frag = document.createDocumentFragment();
    String(text).split('**').forEach((chunk, i) => {
      if (chunk) frag.append(i % 2 ? el('strong', '', chunk) : document.createTextNode(chunk));
    });
    return frag;
  }

  // Image slice generator from source image
  const sources = {};
  function watch(src, node) {
    node.dataset.missing = 'Image not found: ' + src;
    let s = sources[src];
    if (!s) {
      s = sources[src] = { failed: false, nodes: [] };
      const probe = new Image();
      probe.onerror = () => { s.failed = true; s.nodes.forEach(n => n.classList.add('art--missing')); };
      probe.src = src;
    }
    s.nodes.push(node);
    if (s.failed) node.classList.add('art--missing');
  }

  function art(spec, extra) {
    const node = el('div', 'art' + (extra ? ' ' + extra : ''));
    if (spec.alt) { node.setAttribute('role', 'img'); node.setAttribute('aria-label', spec.alt); }
    else node.setAttribute('aria-hidden', 'true');
    let src;
    if (spec.src) {
      src = spec.src;
      node.style.aspectRatio = spec.ratio || '4 / 3';
      node.style.backgroundSize = 'cover';
      node.style.backgroundPosition = spec.focus || 'center';
    } else {
      const S = CONFIG.images[spec.from];
      if (!S || !spec.box) return node;
      const [x, y, w, h] = spec.box;
      src = S.src;
      node.style.aspectRatio = `${w} / ${h}`;
      node.style.backgroundSize = `${(S.width / w) * 100}% ${(S.height / h) * 100}%`;
      node.style.backgroundPosition = `${S.width === w ? 0 : (x / (S.width - w)) * 100}% ${S.height === h ? 0 : (y / (S.height - h)) * 100}%`;
    }
    node.style.backgroundImage = `url("${encodeURI(src)}")`;
    watch(src, node);
    return node;
  }

  function corners(card) {
    ['c-tl', 'c-tr', 'c-bl', 'c-br'].forEach(c => card.append(icon('i-corner', 'corner ' + c)));
  }

  function orderScenes() {
    const main = $('#main'), order = CONFIG.sceneOrder || [];
    [...main.children].forEach(s => { if (s.tagName === 'SECTION' && !order.includes(s.id)) s.remove(); });
    order.forEach(id => { const s = document.getElementById(id); if (s && s.parentElement === main) main.append(s); });
  }

  function bindText() {
    document.querySelectorAll('[data-text]').forEach(n => {
      const v = get(n.dataset.text);
      if (v) n.textContent = v; else n.hidden = true;
    });
    const s = $('#seal span');
    if (s) s.append(initial(CONFIG.groomShort), el('em', '', '&'), initial(CONFIG.brideShort));
    document.title = `${CONFIG.groomShort} & ${CONFIG.brideShort} | Wedding Invitation`;
  }

  function renderBlessing() {
    const b = CONFIG.blessing || {};
    const g = $('#ganesh'); if (g && b.art) g.append(art(b.art, 'art--blend'));
    const fill = (id, list) => {
      const n = document.getElementById(id); if (!n) return;
      (list || []).forEach(t => n.append(el('span', '', t)));
      if (!n.childElementCount) n.hidden = true;
    };
    fill('shloka', b.shloka); fill('parents', b.parents);
  }

  function setText(node, text, code) {
    if (!node) return;
    node.textContent = '';
    node.hidden = !text;
    if (!text) return;
    node.append(rich(text));
    node.lang = isDeva(text) ? code : 'en';
  }

  function setLanguage(code) {
    const s = CONFIG.story[code]; if (!s) return;
    setText($('#story-title'), s.title, code);
    setText($('#story-couple'), s.couple, code);
    setText($('#story-sub'), s.sub, code);
    storyParas.forEach((p, i) => setText(p, (s.paragraphs || [])[i], code));
    setText($('#closing-title'), s.tagline, code);
    setText($('#closing-sub'), s.taglineSub, code);
    setText($('#closing-end'), s.end, code);

    const names = $('#closing-names');
    if (names) {
      const [a, b] = s.names || [];
      names.textContent = '';
      names.hidden = !(a || b);
      if (a) names.append(el('span', '', a));
      if (a && b) names.append(icon('i-heart', 'heart'), el('span', 'sr-only', ' and '));
      if (b) names.append(el('span', '', b));
      names.lang = isDeva(`${a || ''}${b || ''}`) ? code : 'en';
    }
    document.querySelectorAll('#lang-switch button').forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.lang === code)));

    // Update story card contents
    updateStoryCards(code);
  }

  /* ==========================================================================
     SCROLL-DRIVEN OVERLAPPING STORY CARDS
     ========================================================================== */
  const STORY_CHAPTERS = [
    {
      badgeEn: "Chapter I • The First Hello",
      badgeMr: "अध्याय १ • पहिली भेट",
      badgeHi: "अध्याय १ • पहली मुलाक़ात",
      artIndex: 0,
      paras: [0]
    },
    {
      badgeEn: "Chapter II • Friendship to Love",
      badgeMr: "अध्याय २ • मैत्रीतून प्रेम",
      badgeHi: "अध्याय २ • दोस्ती से प्यार",
      artIndex: 1,
      paras: [1]
    },
    {
      badgeEn: "Chapter III • Dreaming of Forever",
      badgeMr: "अध्याय ३ • एकत्र स्वप्ने",
      badgeHi: "अध्याय ३ • सपनों का सफ़र",
      artIndex: 2,
      paras: [2]
    },
    {
      badgeEn: "Chapter IV • Promise of a Lifetime",
      badgeMr: "अध्याय ४ • आयुष्यभराची साथ",
      badgeHi: "अध्याय ४ • साथ निभाने का वादा",
      artIndex: 3,
      paras: [3]
    },
    {
      badgeEn: "Chapter V • Together Forever",
      badgeMr: "अध्याय ५ • लग्न आणि पुढील प्रवास",
      badgeHi: "अध्याय ५ • शादी और हमेशा का साथ",
      artIndex: 4,
      paras: [4, 5]
    }
  ];

  let storyCardsData = [];

  function buildStoryCards() {
    const stack = $('#story-stack');
    if (!stack) return;
    stack.textContent = '';
    storyCardsData = [];
    const arts = CONFIG.storyArt || [];

    STORY_CHAPTERS.forEach((ch, idx) => {
      const card = el('article', 'story-stack-card paper');
      card.dataset.chapter = String(idx);

      // Chapter badge
      const badgeWrap = el('div', 'story-card-badge-wrap');
      const badge = el('span', 'story-card-badge', ch.badgeEn);
      badgeWrap.append(badge);

      // Original large artwork with soft blended edges
      const artSpec = arts[ch.artIndex] || arts[0];
      const artWrap = el('div', 'story-card-art');
      artWrap.append(art(artSpec, 'art--blend'));

      // Story text
      const body = el('div', 'story-card-body');
      const paraNodes = [];
      ch.paras.forEach(() => {
        const p = el('p', '');
        paraNodes.push(p);
        body.append(p);
      });

      // Content wrapper for badge & story text
      const content = el('div', 'story-card-content');
      content.append(badgeWrap, body);

      card.append(artWrap, content);
      corners(card);
      stack.append(card);

      storyCardsData.push({ card, badge, paraNodes, chapter: ch });
    });
  }

  function updateStoryCards(code) {
    const s = CONFIG.story[code];
    if (!s) return;
    storyCardsData.forEach(item => {
      const bText = code === 'hi' ? item.chapter.badgeHi : (code === 'mr' ? item.chapter.badgeMr : item.chapter.badgeEn);
      item.badge.textContent = bText;
      item.chapter.paras.forEach((pIdx, i) => {
        const text = (s.paragraphs || [])[pIdx] || '';
        setText(item.paraNodes[i], text, code);
      });
    });
  }

  function renderStory() {
    buildStoryCards();
    const langs = Object.keys(CONFIG.story || {});
    const sw = $('#lang-switch');
    if (sw) {
      sw.textContent = '';
      langs.forEach(code => {
        const b = el('button', '', CONFIG.story[code].label || code);
        b.type = 'button'; b.lang = code; b.dataset.lang = code;
        b.addEventListener('click', () => setLanguage(code));
        sw.append(b);
      });
      if (langs.length < 2) sw.hidden = true;
    }
    setLanguage(CONFIG.story[CONFIG.storyLanguage] ? CONFIG.storyLanguage : langs[0]);
  }

  function renderWedding() {
    const card = $('#wedding-card'); if (!card) return;
    const w = CONFIG.wedding || {};
    const lines = (id, list) => {
      const n = document.getElementById(id);
      if (n) (list || []).forEach(t => n.append(el('span', '', t)));
    };
    lines('groom-lines', w.groomLines); lines('bride-lines', w.brideLines);
    const holder = $('#wedding-art'); if (holder && w.art) holder.append(art(w.art, 'art--blend'));
    const d = $('#wedding-date'); if (d) { if (start) dateInto(d, CONFIG.weddingStart); else d.hidden = true; }
    corners(card);
  }

  function startCountdown() {
    const box = $('#countdown'), msg = $('#countdown-msg'), label = $('#save-label');
    if (!box) return;
    if (!start) { box.hidden = true; if (label) label.hidden = true; return; }
    const n = { d: $('#cd-d'), h: $('#cd-h'), m: $('#cd-m'), s: $('#cd-s') };
    let timer = null;
    const tick = () => {
      const now = Date.now(), left = start.getTime() - now;
      if (left <= 0) {
        if (timer) { clearInterval(timer); timer = null; }
        box.hidden = true; if (label) label.hidden = true;
        if (msg) msg.textContent = now > end.getTime() ? 'Thank you for celebrating with us.' : 'The celebrations have begun!';
        return;
      }
      const t = Math.floor(left / 1000);
      n.d.textContent = Math.floor(t / 86400);
      n.h.textContent = pad(Math.floor((t % 86400) / 3600));
      n.m.textContent = pad(Math.floor((t % 3600) / 60));
      n.s.textContent = pad(t % 60);
    };
    tick();
    if (start.getTime() > Date.now()) timer = setInterval(tick, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  }

  function setupCalendar() {
    const wrap = $('#cal-actions'); if (!wrap) return;
    if (!start) { wrap.hidden = true; return; }
    const utc = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const title = `Wedding of ${CONFIG.groomShort} & ${CONFIG.brideShort}`;
    const v = CONFIG.venue || {};
    const place = [v.name, v.address || v.city].filter(Boolean).join(', ');
    const details = 'Ceremonies: ' + (CONFIG.events || []).map(e => `${e.name} (${dmy(e.date)}${e.time ? ', ' + e.time : ''})`).join('; ');
    const g = $('#gcal');
    if (g) g.href = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(title) + '&dates=' + utc(start) + '/' + utc(end) + '&details=' + encodeURIComponent(details) + '&location=' + encodeURIComponent(place);
    const ics = $('#ics');
    if (ics) ics.addEventListener('click', () => {
      const esc = t => String(t).replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
      const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Wedding Invitation//EN', 'BEGIN:VEVENT',
        'UID:' + utc(start) + '-wedding@invitation', 'DTSTAMP:' + utc(new Date()), 'DTSTART:' + utc(start), 'DTEND:' + utc(end),
        'SUMMARY:' + esc(title), 'LOCATION:' + esc(place), 'DESCRIPTION:' + esc(details), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
      const url = URL.createObjectURL(new Blob([body], { type: 'text/calendar;charset=utf-8' }));
      const a = el('a'); a.href = url;
      a.download = `${CONFIG.groomShort}-${CONFIG.brideShort}-wedding.ics`.toLowerCase().replace(/[^a-z0-9.]+/g, '-');
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    });
  }

  function renderEvents() {
    const grid = $('#events-grid'); if (!grid) return;
    (CONFIG.events || []).forEach((e, i) => {
      const card = el('article', 'card paper fade');
      if (e.color) card.style.setProperty('--accent', e.color);
      card.setAttribute('aria-labelledby', 'ev-' + i);

      const badge = el('span', 'event-badge', `Ceremony ${i + 1}`);
      card.append(badge);

      if (e.ornament) {
        const o = el('p', 'ornament', e.ornament);
        o.setAttribute('aria-hidden', 'true');
        card.append(o);
      }
      const h = el('h3', 'script', e.name);
      h.id = 'ev-' + i;
      card.append(h, icon('i-heart-rule', 'rule'));
      if (ymd(e.date)) card.append(dateInto(el('p', 'card-date'), e.date));
      if (e.time) card.append(el('p', 'card-time', `(${e.time})`));
      if (e.art) card.append(art(e.art, 'art--blend'));
      corners(card);
      grid.append(card);
    });
  }

  function renderVenue() {
    const card = $('#venue-card'); if (!card) return;
    const v = CONFIG.venue || {};
    const holder = $('#venue-art'); if (holder && v.art) holder.append(art(v.art, 'art--blend'));
    const query = v.mapsQuery || [v.name, v.address || v.city].filter(Boolean).join(', ');
    const link = $('#directions');
    if (link) link.href = v.mapsLink || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
    const map = $('#venue-map');
    if (map && v.showMap) {
      const f = el('iframe');
      f.title = 'Map showing ' + (v.name || 'the venue');
      f.setAttribute('loading', 'lazy');
      f.referrerPolicy = 'no-referrer-when-downgrade';
      f.src = 'https://maps.google.com/maps?q=' + encodeURIComponent(query) + '&output=embed';
      map.append(f); map.hidden = false;
    }
    corners(card);
  }

  function setupShare() {
    const btn = $('#share'), out = $('#share-status'); if (!btn) return;
    btn.addEventListener('click', async () => {
      const url = location.href.split('#')[0];
      const text = `${CONFIG.groomShort} & ${CONFIG.brideShort} cordially invite you to their wedding celebrations!`;
      if (navigator.share) {
        try { await navigator.share({ title: document.title, text, url }); return; }
        catch (err) { if (err && err.name === 'AbortError') return; }
      }
      try {
        await navigator.clipboard.writeText(url);
        out.textContent = 'Invitation link copied! Paste into WhatsApp or messages to share.';
      } catch (err) {
        out.textContent = 'Copy this link to share: ' + url;
      }
    });
  }

  function setupMusic() {
    const btn = $('#music'), audio = $('#bg-music');
    if (!btn || !audio || !CONFIG.music || !CONFIG.music.src) return null;
    audio.src = CONFIG.music.src;
    btn.hidden = false;
    const setState = on => { btn.classList.toggle('is-on', on); btn.setAttribute('aria-pressed', String(on)); };
    const play = () => { const p = audio.play(); if (p && p.then) p.then(() => setState(true)).catch(() => setState(false)); else setState(true); };
    btn.addEventListener('click', () => { if (audio.paused) play(); else { audio.pause(); setState(false); } });
    audio.addEventListener('error', () => { setState(false); btn.hidden = true; });
    return { play };
  }

  // Enhanced Petals & Golden Sparkles
  function petals() {
    const mode = CONFIG.petals;
    if (!mode || mode === 'off' || reduceMotion) return;
    const layer = $('#petals'); if (!layer) return;
    const loop = mode === 'loop';
    const count = window.matchMedia('(max-width: 600px)').matches ? 22 : 36;
    const rose = 'linear-gradient(135deg,#F7C3CB,#E06B82 55%,#A83849)';
    const marigold = 'linear-gradient(135deg,#FFE099,#F5AA32 60%,#D16C12)';
    const r = Math.random;
    for (let i = 0; i < count; i++) {
      const p = el('span', 'petal');
      const isSparkle = r() < 0.28;
      if (isSparkle) p.classList.add('sparkle');
      const color = r() < 0.65 ? rose : marigold;
      p.style.cssText = `--x:${(r() * 100).toFixed(1)}%;--size:${(8 + r() * 10).toFixed(1)}px;--dur:${(8 + r() * 7).toFixed(1)}s;--delay:${(r() * (loop ? 12 : 4)).toFixed(2)}s;--sway:${(2.4 + r() * 2.6).toFixed(1)}s;--loop:${loop ? 'infinite' : 1};--c:${color}`;
      p.append(el('i'));
      if (!loop) p.addEventListener('animationend', ev => { if (ev.target === p) p.remove(); });
      layer.append(p);
    }
    document.addEventListener('visibilitychange', () => layer.classList.toggle('is-paused', document.hidden));
  }

  function setupReveal() {
    const fades = document.querySelectorAll('.fade'), seqs = document.querySelectorAll('[data-sequence]');
    if (reduceMotion || !('IntersectionObserver' in window)) {
      fades.forEach(n => n.classList.add('is-in'));
      seqs.forEach(n => n.classList.add('is-shown'));
      return;
    }
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add(en.target.hasAttribute('data-sequence') ? 'is-shown' : 'is-in');
      io.unobserve(en.target);
    }), { threshold: 0.15, rootMargin: '0px 0px -6% 0px' });
    fades.forEach(n => io.observe(n)); seqs.forEach(n => io.observe(n));
  }

  function setupOpening(music) {
    const opening = $('#opening'), seal = $('#seal'), glow = $('#glow'), hint = $('#op-hint');
    const behind = [$('#main'), $('#music')].filter(Boolean);
    const finish = () => {
      if (opening) opening.hidden = true;
      document.documentElement.classList.remove('is-locked');
      behind.forEach(n => { n.inert = false; });
      petals();
      setupReveal();
      const h = $('#couple-names'); if (h) h.focus({ preventScroll: true });
    };
    if (!opening || !seal) { finish(); return; }
    document.documentElement.classList.add('is-locked');
    behind.forEach(n => { n.inert = true; });
    let opened = false;
    const triggerOpen = () => {
      if (opened) return;
      opened = true;
      seal.setAttribute('aria-disabled', 'true');
      if (music && CONFIG.music.playOnOpen) music.play();
      if (reduceMotion) { finish(); return; }
      const r = seal.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const far = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
      glow.style.left = cx + 'px'; glow.style.top = cy + 'px';
      glow.style.setProperty('--s', String(Math.ceil(far / 12) + 2));
      opening.classList.add('is-opening');
      setTimeout(() => opening.classList.add('is-fading'), 1450);
      setTimeout(finish, 2000);
    };
    seal.addEventListener('click', triggerOpen);
    if (hint) {
      hint.addEventListener('click', triggerOpen);
      hint.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); triggerOpen(); } });
    }
  }

  function init() {
    if (typeof CONFIG === 'undefined') throw new Error('CONFIG is missing');
    start = toDate(CONFIG.weddingStart);
    end = toDate(CONFIG.weddingEnd);
    if (start && (!end || end <= start)) end = new Date(start.getTime() + 6 * 3600 * 1000);
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
    petals();
    orderScenes();
    bindText();
    renderBlessing();
    renderStory();
    renderWedding();
    startCountdown();
    setupCalendar();
    renderEvents();
    renderVenue();
    setupShare();
    setupOpening(setupMusic());
  }

  try { init(); }
  catch (err) {
    console.error('Invitation setup error:', err);
    document.documentElement.classList.remove('js', 'is-locked');
    ['#main', '#music'].forEach(s => { const n = $(s); if (n) n.inert = false; });
    document.body.prepend(el('p', 'setup-error', 'Setup error: check the CONFIG section for a missing comma, quote or bracket.'));
  }
})();
</script>
</body>
</html>
